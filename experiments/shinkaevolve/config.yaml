# ShinkaEvolve config for Japanese fraud detection pipeline
# Optimized for local Ollama inference (qwen2.5:14b)

max_evaluation_jobs: 1
max_proposal_jobs: 1
verbose: true

evo:
  num_generations: 20
  patch_types:
    - "diff"
    - "full"
  patch_type_probs:
    - 0.7
    - 0.3
  max_patch_resamples: 3
  max_patch_attempts: 3
  llm_models:
    - "local/qwen2.5:14b@http://localhost:11434/v1"
  llm_dynamic_selection: null
  llm_kwargs:
    temperatures:
      - 0.7
    max_tokens: 4096
  embedding_model: null
  meta_rec_interval: null
  evolve_prompts: false

db:
  num_islands: 2
  archive_size: 20
  archive_selection_strategy: "fitness"
  elite_selection_ratio: 0.3
  num_archive_inspirations: 1
  num_top_k_inspirations: 1
  migration_interval: 10
  migration_rate: 0.1
  island_elitism: true
  enforce_island_separation: true
  parent_selection_strategy: "weighted"
  parent_selection_lambda: 10.0

job:
  time: "00:02:00"
